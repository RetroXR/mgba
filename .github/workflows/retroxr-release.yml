# Build the retroXR mGBA core for Windows, Android, Linux and macOS and publish
# it as a release, so retroXR's CoreDownloadManager can fetch it.
#
# This fork exists for one thing: mGBA has carried its own lockstep link
# coordinator for years and nothing in libretro could reach it. Two cores in one
# process are two copies of the library sharing no globals, so the only thing two
# handhelds have in common is the frontend -- and this build talks to a link bus
# the frontend hosts. That is what makes two Game Boys in one room play together,
# single-cartridge play work, and a GameCube lead reach a handheld at all.
#
# mGBA is MPL-2.0, so unlike Dolphin there is no source obligation attached to
# the binary. The source sits on the tag beside it anyway, for the practical
# reason that it is the only way anyone can tell what they are running.
#
# The contract with the app is entirely in the asset names. RetroXR reads
# CoreSources.SOURCES["mgba"].assets and asks for exactly one filename per
# platform; a miss is reported as a miss rather than falling back to the
# buildbot, so a renamed asset here is a core that simply never downloads.
#
#   Windows  mgba_libretro.dll.zip          containing mgba_libretro.dll
#   Android  mgba_libretro_android.so.zip   containing mgba_libretro_android.so
#   Linux    mgba_libretro.so.zip           containing mgba_libretro.so
#   macOS    mgba_libretro_arm64.dylib.zip
#            mgba_libretro_x86_64.dylib.zip  each containing mgba_libretro.dylib
#
# Note the _android infix, which azahar's asset does NOT have. The two sit next
# to each other in core_sources.gd and the wrong name fails silently.
#
# The release must NOT be a prerelease: the download URL is the /releases/latest/
# form so shipping a build needs no app update, and GitHub's `latest` skips
# prereleases. Anything else cut on this fork should be marked prerelease.
name: retroXR core release

on:
  push:
    tags:
      - 'retroxr-mgba-libretro-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
        default: 'retroxr'
      tag:
        description: 'Release tag to publish as (leave blank to build without publishing)'
        required: false
        default: ''

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Every flag here is load-bearing and was found the hard way on a desktop:
      # without the policy version the vendored zlib and libpng refuse to
      # configure, without ENABLE_DIRECTORIES the Windows VFS source does not
      # compile, and with zlib found but not linked the core fails at crc32.
      - name: Configure (MSVC)
        run: >
          cmake -S . -B build-win -G "Visual Studio 18 2026" -A x64
          -DBUILD_LIBRETRO=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF
          -DSKIP_LIBRARY=ON -DUSE_DISCORD_RPC=OFF
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          "-DCMAKE_C_FLAGS=/DENABLE_DIRECTORIES"
          -DUSE_ZLIB=OFF -DUSE_PNG=OFF -DUSE_LIBZIP=OFF -DUSE_MINIZIP=OFF
          -DUSE_LZMA=OFF -DUSE_SQLITE3=OFF -DUSE_ELF=OFF -DUSE_FFMPEG=OFF
          -DUSE_EPOXY=OFF

      - name: Build
        run: cmake --build build-win --config Release --target mgba_libretro --parallel

      - name: Package
        shell: pwsh
        run: |
          $hits = @(Get-ChildItem -Path build-win -Recurse -Filter "mgba_libretro.dll" -File)
          if ($hits.Count -ne 1) {
            Write-Host "expected exactly one mgba_libretro.dll, found $($hits.Count):"
            $hits | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item $hits[0].FullName stage/mgba_libretro.dll
          Compress-Archive -Path stage/mgba_libretro.dll -DestinationPath mgba_libretro.dll.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: mgba_libretro.dll.zip
          if-no-files-found: error

  android:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build wget unzip zip
          # Into RUNNER_TEMP, NOT the workspace. This step runs before
          # actions/checkout, and checkout clears the workspace it checks into --
          # so an NDK unpacked at $PWD here exists at the end of this step and is
          # gone by the time cmake looks for its toolchain file. The failure names
          # a missing toolchain rather than a missing NDK, which sends you looking
          # at the wrong thing entirely.
          wget -q -O "$RUNNER_TEMP/ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r27d" >> $GITHUB_ENV

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      # The optional libraries are turned OFF explicitly, and that is not a
      # departure from the desktop build -- it is how you reproduce it here.
      #
      # That build ran on a Windows host, where none of these exists to be found
      # and every one of them quietly resolved to off. A Linux runner HAS them,
      # for x86_64, and mGBA's CMake finds them: the link line picks up
      # -L/usr/lib/x86_64-linux-gnu -lm, lld infers an x86_64 target from the
      # host libm it then loads, and rejects the NDK's own arm64-only
      # --fix-cortex-a53-843419 with "only supported on AArch64 targets". The
      # error names a CPU erratum flag and has nothing to do with one.
      #
      # A cross-build must never be left to discover libraries; the ones it finds
      # are the wrong architecture by construction.
      - name: Configure
        run: >
          cmake -S . -B build-android-arm64 -G Ninja
          -DBUILD_LIBRETRO=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          -DUSE_ZLIB=OFF -DUSE_PNG=OFF -DUSE_LIBZIP=OFF -DUSE_MINIZIP=OFF
          -DUSE_LZMA=OFF -DUSE_SQLITE3=OFF -DUSE_ELF=OFF -DUSE_FFMPEG=OFF
          -DUSE_EPOXY=OFF -DUSE_DISCORD_RPC=OFF -DUSE_EDITLINE=OFF
          -DUSE_FREETYPE=OFF -DUSE_LUA=OFF -DUSE_JSON_C=OFF

      # The libretro target is a file(GLOB) evaluated at configure time, so a new
      # source file added since the last configure links as an undefined symbol.
      # A fresh tree per run makes that a non-issue here; it bites on a desktop.
      - name: Build
        run: cmake --build build-android-arm64 --target mgba_libretro -j $(nproc)

      - name: Package
        run: |
          mapfile -t hits < <(find build-android-arm64 -name 'mgba_libretro*.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one mgba_libretro*.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/mgba_libretro_android.so

          # Strip, because CMake does not and nothing downstream will. This core
          # is downloaded onto a headset at runtime and kept in internal storage,
          # and better than half of it is debug_info. (ndk-build strips on
          # install, which is why the Makefile-based cores never needed this and
          # this one does.)
          #
          # --strip-unneeded and not --strip-all: the frontend finds this core by
          # dlsym, so removing the dynamic symbol table would leave a core that
          # downloads, installs, and cannot be loaded at all.
          STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          before=$(stat -c%s stage/mgba_libretro_android.so)
          "$STRIP" --strip-unneeded stage/mgba_libretro_android.so
          after=$(stat -c%s stage/mgba_libretro_android.so)
          echo "stripped: $before -> $after bytes"

          # And prove the entry points survived it, rather than assuming. A core
          # missing these is indistinguishable from a failed download to anyone
          # looking at the app.
          exports=$("$NM" --dynamic --defined-only stage/mgba_libretro_android.so \
            | grep -c ' retro_' || true)
          echo "retro_* exports after stripping: $exports"
          for sym in retro_api_version retro_init retro_load_game retro_run; do
            if ! "$NM" --dynamic --defined-only stage/mgba_libretro_android.so \
                 | grep -q " $sym\$"; then
              echo "FATAL: $sym is not exported after stripping"
              exit 1
            fi
          done

          (cd stage && zip -q -X ../mgba_libretro_android.so.zip mgba_libretro_android.so)
          ls -lh mgba_libretro_android.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mgba_libretro_android.so.zip
          if-no-files-found: error

  # The oldest Ubuntu runner: a shared library loads only against a glibc at
  # least as new as the one it was linked with.
  #
  # The optional libraries are off for the same reason as on Android, turned
  # round: this runner HAS zlib, libpng and friends, mGBA's CMake would find
  # them, and the core would then carry a DT_NEEDED on each -- a load failure on
  # any desktop that lacks one. The other platforms ship without them, so this
  # one does too, and the package step fails the run if anything but libc and
  # libm is named.
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configure
        run: >
          cmake -S . -B build-linux -G Ninja
          -DBUILD_LIBRETRO=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DUSE_ZLIB=OFF -DUSE_PNG=OFF -DUSE_LIBZIP=OFF -DUSE_MINIZIP=OFF
          -DUSE_LZMA=OFF -DUSE_SQLITE3=OFF -DUSE_ELF=OFF -DUSE_FFMPEG=OFF
          -DUSE_EPOXY=OFF -DUSE_DISCORD_RPC=OFF -DUSE_EDITLINE=OFF
          -DUSE_FREETYPE=OFF -DUSE_LUA=OFF -DUSE_JSON_C=OFF

      - name: Build
        run: cmake --build build-linux --target mgba_libretro -j $(nproc)

      - name: Package
        run: |
          mapfile -t hits < <(find build-linux -name 'mgba_libretro*.so' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one mgba_libretro*.so, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          cp "${hits[0]}" stage/mgba_libretro.so

          # Stripped for the same reason as the Android core, and with the same
          # care: --strip-unneeded keeps the dynamic symbols the frontend dlsyms.
          before=$(stat -c%s stage/mgba_libretro.so)
          strip --strip-unneeded stage/mgba_libretro.so
          after=$(stat -c%s stage/mgba_libretro.so)
          echo "stripped: $before -> $after bytes"
          for sym in retro_api_version retro_init retro_load_game retro_run; do
            if ! nm --dynamic --defined-only stage/mgba_libretro.so \
                 | grep -q " $sym\$"; then
              echo "FATAL: $sym is not exported after stripping"
              exit 1
            fi
          done

          readelf -d stage/mgba_libretro.so | grep NEEDED
          if readelf -d stage/mgba_libretro.so | grep NEEDED \
               | grep -Ev '\[(libc|libm|libpthread|libdl|ld-linux-x86-64)\.so'; then
            echo "FATAL: mgba_libretro.so needs a library a desktop may not have"
            exit 1
          fi

          (cd stage && zip -q -X ../mgba_libretro.so.zip mgba_libretro.so)
          file stage/mgba_libretro.so
          ls -lh mgba_libretro.so.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: mgba_libretro.so.zip
          if-no-files-found: error

  # Both architectures on one Apple Silicon runner. CMake cross-compiles to
  # x86_64 with nothing but CMAKE_OSX_ARCHITECTURES; the optional libraries are
  # off because Homebrew's, where the runner has them, are arm64 only and would
  # either break the x86_64 link or pin the core to a Homebrew prefix.
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: arm64
            target: '11.0'
          - arch: x86_64
            target: '10.13'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configure
        run: >
          cmake -S . -B build-macos
          -DBUILD_LIBRETRO=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.target }}
          -DUSE_ZLIB=OFF -DUSE_PNG=OFF -DUSE_LIBZIP=OFF -DUSE_MINIZIP=OFF
          -DUSE_LZMA=OFF -DUSE_SQLITE3=OFF -DUSE_ELF=OFF -DUSE_FFMPEG=OFF
          -DUSE_EPOXY=OFF -DUSE_DISCORD_RPC=OFF -DUSE_EDITLINE=OFF
          -DUSE_FREETYPE=OFF -DUSE_LUA=OFF -DUSE_JSON_C=OFF

      - name: Build
        run: cmake --build build-macos --target mgba_libretro -j $(sysctl -n hw.ncpu)

      - name: Package
        run: |
          hits=()
          while IFS= read -r f; do hits+=("$f"); done \
            < <(find build-macos -name 'mgba_libretro*.dylib' -type f)
          if [ "${#hits[@]}" -ne 1 ]; then
            echo "expected exactly one mgba_libretro*.dylib, found ${#hits[@]}:"
            printf '  %s\n' "${hits[@]}"
            exit 1
          fi
          mkdir -p stage
          lib=stage/mgba_libretro.dylib
          cp "${hits[0]}" "$lib"
          lipo -info "$lib"
          if [ "$(lipo -archs "$lib")" != "${{ matrix.arch }}" ]; then
            echo "$lib is not ${{ matrix.arch }}"
            exit 1
          fi
          # otool -L lists the library's own install name among its dependents,
          # so that line is dropped by name; everything else must be the system.
          # (Foundation is expected: mGBA's CMake links it on every Apple build.)
          otool -L "$lib"
          if otool -L "$lib" | tail -n +2 | grep -v '@rpath/mgba_libretro\.dylib ' \
               | grep -Ev '^[[:space:]]*/(usr/lib|System/Library)/'; then
            echo "FATAL: $lib links a library outside the system"
            exit 1
          fi
          (cd stage && zip -q -X ../mgba_libretro_${{ matrix.arch }}.dylib.zip mgba_libretro.dylib)
          ls -lh mgba_libretro_${{ matrix.arch }}.dylib.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: mgba_libretro_${{ matrix.arch }}.dylib.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, android, linux, macos]
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -lh dist
          cat > notes.md <<EOF
          mGBA libretro core built for retroXR, from \`$GITHUB_SHA\`.

          Windows x86_64, Android arm64-v8a, Linux x86_64 and macOS arm64 and
          x86_64. The source for these binaries is this tag.

          Over the stock buildbot build this reaches mGBA's link coordinator
          through a bus the frontend hosts, for both the Game Boy Advance and the
          Game Boy -- they are separate cores with separate serial ports, and the
          Game Boy side carried nothing at all before it.

          It hands the e-Reader its dot-code cards through disk control, and
          carries the scanner and the card on it in the savestate -- upstream
          left both out, so a rollback or a late netplay joiner restored a GBA
          whose scanner disagreed with the one it was taken from.
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "mGBA (retroXR build) $TAG" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" \
            dist/mgba_libretro.dll.zip \
            dist/mgba_libretro_android.so.zip \
            dist/mgba_libretro.so.zip \
            dist/mgba_libretro_arm64.dylib.zip \
            dist/mgba_libretro_x86_64.dylib.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
